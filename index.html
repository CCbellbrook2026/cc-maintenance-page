<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Launching Soon — Christ's Church Bellbrook</title>
<style>
  :root {
    --orange-1: #FF8A3D;
    --orange-2: #E4622C;
    --gold: #FFD37A;
    --bg-0: #08090B;
    --text-dim: #A6ACB4;
    --text-faint: #5B6169;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg-0);
    color: #F5F3F0;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px;
    position:relative;
    overflow:hidden;
  }

  canvas#fw {
    position:absolute; inset:0; width:100%; height:100%;
    z-index:1;
  }

  .glow {
    position:absolute;
    width:900px; height:900px;
    left:50%; top:46%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,138,61,0.16) 0%, rgba(228,98,44,0.06) 38%, rgba(228,98,44,0) 68%);
    filter: blur(10px);
    pointer-events:none;
    z-index:0;
  }

  .card {
    position:relative; z-index:2;
    width:100%; max-width:580px;
    text-align:center;
  }

  .logo { height:70px; margin:0 auto 52px; display:block; }

  .eyebrow {
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom:22px;
  }
  .eyebrow .dot {
    width:6px; height:6px; border-radius:50%;
    background: linear-gradient(135deg, var(--orange-1), var(--gold));
    box-shadow: 0 0 12px rgba(255,180,80,0.9);
  }

  h1 {
    font-size:52px; font-weight:800; letter-spacing:-1.3px;
    line-height:1.1; margin-bottom:20px;
    color:#FBFAF9;
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--gold), var(--orange-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  p {
    font-size:17px; line-height:1.7; color: var(--text-dim);
    max-width:440px; margin:0 auto;
  }

  .footer {
    margin-top:56px;
    font-size:12.5px; letter-spacing:0.4px;
    color: var(--text-faint);
  }
  .footer a { color: var(--text-dim); text-decoration:none; border-bottom:1px solid rgba(255,255,255,0.15); }

  @media (max-width:480px) {
    h1 { font-size:36px; }
    p { font-size:15px; }
    .logo { height:50px; margin:0 auto 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    canvas#fw { display:none; }
  }
</style>
</head>

<script>
(function(){
  var canvas = document.getElementById('fw');
  var ctx = canvas.getContext('2d');
  var W, H, dpr;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var palettes = [
    ['#FF8A3D','#FFD37A'],
    ['#FF5F6D','#FFD37A'],
    ['#FFB347','#FFF3D6'],
    ['#E4622C','#FFE8B8'],
    ['#FF7A45','#FFFFFF']
  ];

  var rockets = [];
  var particles = [];
  var flashes = [];

  function launchRocket(){
    var x = (0.12 + Math.random()*0.76) * W;
    var apexY = H * (0.16 + Math.random()*0.30);
    var startY = H + 20*dpr;
    var dist = startY - apexY;
    var duration = 46 + Math.random()*22;
    var vy = -dist/duration;
    var palette = palettes[Math.floor(Math.random()*palettes.length)];
    rockets.push({
      x:x, y:startY, vy:vy, apexY:apexY,
      color: palette[0], sparkColor: palette[1],
      trail: [], wobble: (Math.random()-0.5)*0.35
    });
    setTimeout(launchRocket, 900 + Math.random()*1100);
  }
  setTimeout(launchRocket, 400);
  setTimeout(launchRocket, 1100);

  function burst(x, y, color, sparkColor){
    flashes.push({x:x, y:y, life:1, size: 4*dpr});
    var count = 60 + Math.floor(Math.random()*30);
    for (var i=0;i<count;i++){
      var angle = (Math.PI*2) * (i/count) + Math.random()*0.15;
      var speed = (1.6 + Math.random()*3.4) * dpr;
      var useSpark = Math.random() < 0.28;
      particles.push({
        x:x, y:y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: 0.008 + Math.random()*0.010,
        color: useSpark ? sparkColor : color,
        size: (1.1 + Math.random()*1.6) * dpr,
        flicker: Math.random() < 0.4
      });
    }
    // a few trailing streamers for realism
    for (var j=0;j<10;j++){
      var a2 = Math.random()*Math.PI*2;
      var sp2 = (3.5 + Math.random()*2.5) * dpr;
      particles.push({
        x:x, y:y,
        vx: Math.cos(a2)*sp2,
        vy: Math.sin(a2)*sp2,
        life:1,
        decay: 0.006 + Math.random()*0.006,
        color: sparkColor,
        size: 0.8*dpr,
        flicker:true
      });
    }
  }

  function tick(){
    ctx.clearRect(0,0,W,H);

    // rockets rising
    ctx.globalCompositeOperation = 'lighter';
    for (var r=rockets.length-1; r>=0; r--){
      var rk = rockets[r];
      rk.trail.push({x:rk.x, y:rk.y});
      if (rk.trail.length > 16) rk.trail.shift();
      rk.x += rk.wobble * dpr;
      rk.y += rk.vy;
      rk.vy += 0.02*dpr;

      for (var t=0; t<rk.trail.length; t++){
        var pt = rk.trail[t];
        var a = (t/rk.trail.length) * 0.5;
        ctx.beginPath();
        ctx.globalAlpha = a;
        ctx.fillStyle = rk.color;
        ctx.arc(pt.x, pt.y, 1.3*dpr, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.fillStyle = '#FFF6E0';
      ctx.shadowColor = rk.color;
      ctx.shadowBlur = 8*dpr;
      ctx.arc(rk.x, rk.y, 1.8*dpr, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (rk.y <= rk.apexY){
        burst(rk.x, rk.y, rk.color, rk.sparkColor);
        rockets.splice(r,1);
      }
    }

    // burst flashes
    for (var f=flashes.length-1; f>=0; f--){
      var fl = flashes[f];
      fl.life -= 0.07;
      fl.size += 3.4*dpr;
      if (fl.life <= 0){ flashes.splice(f,1); continue; }
      ctx.beginPath();
      ctx.globalAlpha = Math.max(fl.life,0) * 0.5;
      ctx.fillStyle = '#FFFFFF';
      ctx.arc(fl.x, fl.y, fl.size, 0, Math.PI*2);
      ctx.fill();
    }

    // burst particles
    for (var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04 * dpr;
      p.vx *= 0.986;
      p.vy *= 0.986;
      p.life -= p.decay;
      if (p.life <= 0){ particles.splice(i,1); continue; }
      var alpha = p.life;
      if (p.flicker) alpha *= (0.5 + Math.random()*0.5);
      ctx.beginPath();
      ctx.globalAlpha = Math.max(alpha, 0);
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
