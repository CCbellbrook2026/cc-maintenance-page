<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We're Launching Soon — Christ's Church Bellbrook</title>
<style>
  :root {
    --orange-1: #FF8A3D;
    --orange-2: #E4622C;
    --gold: #FFD37A;
    --bg-0: #08090B;
    --text-dim: #A6ACB4;
    --text-faint: #5B6169;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg-0);
    color: #F5F3F0;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px;
    position:relative;
    overflow:hidden;
  }

  canvas#fw {
    position:absolute; inset:0; width:100%; height:100%;
    z-index:1;
  }

  .glow {
    position:absolute;
    width:900px; height:900px;
    left:50%; top:46%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,138,61,0.16) 0%, rgba(228,98,44,0.06) 38%, rgba(228,98,44,0) 68%);
    filter: blur(10px);
    pointer-events:none;
    z-index:0;
  }

  .card {
    position:relative; z-index:2;
    width:100%; max-width:580px;
    text-align:center;
  }

  .logo { height:74px; margin-bottom:52px; opacity:0.95; }

  .eyebrow {
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom:22px;
  }
  .eyebrow .dot {
    width:6px; height:6px; border-radius:50%;
    background: linear-gradient(135deg, var(--orange-1), var(--gold));
    box-shadow: 0 0 12px rgba(255,180,80,0.9);
  }

  h1 {
    font-size:52px; font-weight:800; letter-spacing:-1.3px;
    line-height:1.1; margin-bottom:20px;
    color:#FBFAF9;
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--gold), var(--orange-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  p {
    font-size:17px; line-height:1.7; color: var(--text-dim);
    max-width:440px; margin:0 auto;
  }

  .footer {
    margin-top:56px;
    font-size:12.5px; letter-spacing:0.4px;
    color: var(--text-faint);
  }
  .footer a { color: var(--text-dim); text-decoration:none; border-bottom:1px solid rgba(255,255,255,0.15); }

  @media (max-width:480px) {
    h1 { font-size:36px; }
    p { font-size:15px; }
    .logo { height:52px; margin-bottom:40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    canvas#fw { display:none; }
  }
</style>
</head>

<script>
(function(){
  var canvas = document.getElementById('fw');
  var ctx = canvas.getContext('2d');
  var W, H, dpr;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var colors = ['#FF8A3D','#E4622C','#FFD37A','#FFF3D6','#FF5F6D'];
  var particles = [];

  function burst(x, y){
    var count = 46 + Math.floor(Math.random()*20);
    var color = colors[Math.floor(Math.random()*colors.length)];
    for (var i=0;i<count;i++){
      var angle = (Math.PI*2) * (i/count) + Math.random()*0.2;
      var speed = (2 + Math.random()*3.2) * dpr;
      particles.push({
        x:x, y:y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: 0.010 + Math.random()*0.012,
        color: color,
        size: (1.4 + Math.random()*1.8) * dpr
      });
    }
  }

  function scheduleBurst(){
    var x = (0.18 + Math.random()*0.64) * W;
    var y = (0.15 + Math.random()*0.4) * H;
    burst(x,y);
    var next = 1100 + Math.random()*1400;
    setTimeout(scheduleBurst, next);
  }
  setTimeout(scheduleBurst, 500);

  function tick(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045 * dpr;
      p.vx *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0){ particles.splice(i,1); continue; }
      ctx.beginPath();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
